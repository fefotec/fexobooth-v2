name: Build Windows .exe (Test, kein Release)

# Baut die Fexobooth-Windows-.exe (Installer) in der Cloud auf einem Windows-Runner
# und legt sie als HERUNTERLADBARES ARTEFAKT ab.
#
# WICHTIG: Es wird KEIN GitHub-Release und KEIN Tag erstellt -> die Box zieht
# über ihren OTA-Updater NICHTS automatisch. Du lädst die .exe manuell von der
# Actions-Run-Seite herunter und spielst sie selbst auf die Box.
#
# Nutzung: GitHub → Tab "Actions" → "Build Windows .exe (Test, kein Release)"
#          → "Run workflow" → Version eingeben (z.B. 2.4.10) → Run.
#          Nach ein paar Minuten unten auf der Run-Seite unter "Artifacts" laden.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z (nur für Dateiname/Anzeige; kein Release)'
        required: true
        default: '2.4.64'
        type: string
      allow_no_bridge:
        description: 'Build auch OHNE FexoNikonBridge zulassen (Nikon-Support fehlt dann)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Version-Format prüfen
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error 'Version muss das Format X.Y.Z haben, z.B. 2.4.10'
            exit 1
          }

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0.0"

      - name: Kamera- und Video-Regressionstests
        shell: pwsh
        run: python tests/alle_tests.py

      - name: Version in src/__init__.py + installer.iss setzen (nur lokal im Build)
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          (Get-Content 'src/__init__.py') -replace '__version__ = ".*"', "__version__ = ""$v""" | Set-Content 'src/__init__.py' -Encoding utf8
          Write-Host "Version gesetzt: $v"

      - name: PyInstaller-Build
        shell: pwsh
        run: pyinstaller fexobooth.spec --noconfirm --distpath installer_output

      - name: Videos-Ordner + START.bat ergänzen (wie build_installer.bat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'installer_output/fexobooth/assets/videos' | Out-Null
          if (Test-Path 'assets/videos/start.mp4') { Copy-Item 'assets/videos/start.mp4' 'installer_output/fexobooth/assets/videos/' -Force }
          if (Test-Path 'assets/videos/end.mp4')   { Copy-Item 'assets/videos/end.mp4'   'installer_output/fexobooth/assets/videos/' -Force }
          $start = "@echo off`r`ncd /d `"%~dp0`"`r`nstart `"`" fexobooth.exe`r`n"
          Set-Content -Path 'installer_output/fexobooth/START.bat' -Value $start -Encoding ascii -NoNewline

      - name: installer_files vorbereiten (Produktions-Launcher, gitignored)
        shell: pwsh
        run: |
          # installer_files/ ist gitignored (liegt nur auf dem Windows-PC). Wir
          # erzeugen die Produktions-Launcher, die die installierte fexobooth.exe
          # starten (nicht das Python-Quellscript wie die Root-Bats).
          New-Item -ItemType Directory -Force -Path 'installer_files' | Out-Null
          $prod = "@echo off`r`ncd /d `"%~dp0`"`r`nstart `"`" fexobooth.exe`r`n"
          Set-Content -Path 'installer_files/start_fexobooth.bat' -Value $prod -Encoding ascii -NoNewline
          $dev = "@echo off`r`ncd /d `"%~dp0`"`r`nstart `"`" fexobooth.exe --dev`r`n"
          Set-Content -Path 'installer_files/start_dev.bat' -Value $dev -Encoding ascii -NoNewline

      - name: FexoNikonBridge bauen (Nikon, unsichtbarer Hintergrundprozess)
        id: bridge
        continue-on-error: true
        shell: pwsh
        run: |
          # Kleiner .NET-Framework-4.8-Prozess (kein Fenster), Motor: CameraControl.Devices
          # (MIT). Ersetzt den frueheren sichtbaren digiCamControl-Ansatz komplett.
          dotnet build bridge/FexoNikonBridge/FexoNikonBridge.csproj -c Release --no-incremental
          if ($LASTEXITCODE -ne 0) { throw 'FexoNikonBridge-Build fehlgeschlagen' }
          python tools/nikon_bridge_protocol_test.py
          if ($LASTEXITCODE -ne 0) { throw 'FexoNikonBridge-Protokolltest fehlgeschlagen' }
          New-Item -ItemType Directory -Force -Path 'installer_output/fexobooth/bridge' | Out-Null
          Copy-Item 'bridge/FexoNikonBridge/bin/Release/net48/*' 'installer_output/fexobooth/bridge/' -Recurse -Force
          Write-Host 'FexoNikonBridge gebaut und nach installer_output/fexobooth/bridge/ kopiert.'

      - name: Bridge-Gate (Run scheitert, wenn Bridge fehlt und nicht explizit erlaubt)
        shell: pwsh
        run: |
          if (-not (Test-Path 'installer_output/fexobooth/bridge/FexoNikonBridge.exe')) {
            if ('${{ inputs.allow_no_bridge }}' -eq 'true') {
              Write-Warning 'FexoNikonBridge fehlt - Build laeuft auf ausdruecklichen Wunsch OHNE Nikon-Support weiter.'
            } else {
              Write-Error 'FexoNikonBridge.exe fehlt - Abbruch, Installer wuerde ohne Nikon-Support gebaut. (Input allow_no_bridge=true setzen, um bewusst ohne zu bauen.)'
              exit 1
            }
          }

      - name: Windows-Installer bauen (Inno Setup)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = '${{ inputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v installer.iss
          if (Test-Path "installer_output/FexoBooth_Setup_$v.exe") {
            Write-Host "Installer gebaut: FexoBooth_Setup_$v.exe"
          } else {
            Write-Warning 'Installer-.exe wurde nicht gefunden – ZIP-Fallback im Artefakt nutzen.'
          }

      - name: OTA-ZIP als Fallback erstellen
        shell: pwsh
        run: |
          Compress-Archive -Path 'installer_output/fexobooth/*' -DestinationPath 'installer_output/fexobooth.zip' -Force
          $size = [math]::Round((Get-Item 'installer_output/fexobooth.zip').Length / 1MB, 1)
          Write-Host "fexobooth.zip erstellt ($size MB)"

      - name: Download-Artefakt hochladen (Installer-.exe + ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: FexoBooth-${{ inputs.version }}
          path: |
            installer_output/FexoBooth_Setup_*.exe
            installer_output/fexobooth.zip
          if-no-files-found: error

      - name: Hinweis
        shell: pwsh
        run: |
          Write-Host '──────────────────────────────────────────────'
          Write-Host ' Fertig. KEIN Release erstellt – Box zieht nichts.'
          Write-Host ' Download: Run-Seite oben → Abschnitt "Artifacts" → FexoBooth-${{ inputs.version }}'
          Write-Host '──────────────────────────────────────────────'
